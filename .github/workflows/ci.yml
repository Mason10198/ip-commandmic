name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Configure macOS loopback aliases
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 255.0.0.0
          sudo ifconfig lo0 alias 127.0.0.3 255.0.0.0
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,audio]"
      - name: Run complete suite
        run: python -m pytest -q

  package:
    name: Build and test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Inspect and test installed artifacts
        run: python scripts/verify_release.py --dist dist --test-artifacts
      - name: Retain verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: ip-commandmic-distributions
          path: dist/*
          if-no-files-found: error
